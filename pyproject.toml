[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bagre-segmentation"
version = "0.1.0"
description = "Reproducible Sentinel-2 land-cover segmentation benchmark at Bagre, Burkina Faso"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "rasterio>=1.3",
  "torch>=2.2",
  "torchvision>=0.17",
  "segmentation-models-pytorch>=0.3.4",
  "albumentations>=1.4",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "joblib>=1.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
