seed: 42

classes:
  names: [cropland, natural_vegetation, built_up, bare_sparse, water]
  ignore_index: 255
  # ESA WorldCover v200 class value -> merged class index.
  worldcover_map:
    40: 0
    10: 1
    20: 1
    30: 1
    90: 1
    95: 1
    100: 1
    50: 2
    60: 3
    80: 4

data:
  patch_size: 256
  train_stride: 128
  eval_stride: 256
  min_valid_fraction: 0.80
  split:
    method: vertical_stripes
    train_fraction: 0.60
    validation_fraction: 0.20
    buffer_tiles: 1

model:
  architecture: unet
  encoder: resnet34
  encoder_weights: imagenet
  in_channels: 4

training:
  epochs: 50
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 2
  early_stopping_patience: 8
  scheduler_patience: 3
  scheduler_factor: 0.5
  amp: true

random_forest:
  n_estimators: 100
  max_depth: 20
  min_samples_leaf: 2
  max_pixels_per_class: 50000
  n_jobs: -1

evaluation:
  num_examples: 4
